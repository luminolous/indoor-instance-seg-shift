# Shared defaults for every run. Overridden by configs/models/<model>.yaml, then by
# configs/runs/<run_id>.yaml. Relative paths are resolved from the repository root.

seed: 42
deterministic: false  # true = deterministic cuDNN algorithms (slower); seeding is always on
amp: true

# Training wall-clock cap per run (assignment: 2 h of GPU time per model).
time_cap_hours: 2.0

paths:
  dataset_root: dataset/panoptic-indoor-segmentation.v5i.coco-segmentation
  phone_root: dataset/manual-benchmark
  derived_root: dataset/derived
  runs_root: runs
  pretrained_root: runs/pretrained  # downloaded COCO-pretrained weights
  results_root: results
  gpu_time_log: runs/gpu_time_log.csv

data:
  num_classes: 75  # COCO category ids 0-74; id 0 (indoor-objects) has no annotations
  splits:
    train: train
    valid: valid
    test: test
  annotation_file: _annotations.coco.json
  # Images whose pixels are stored rotated relative to their JSON size and polygons (no EXIF).
  # Value = counter-clockwise rotation in degrees applied when the image is loaded, so pixels
  # match the annotations. The dataset files are never modified. Each entry was checked by
  # overlaying the polygons (see results/data_validation.md). Direction differs per image.
  rotation_fixes:
    182169107_jpg.rf.c9b1bbecf1474a5b36a6df197c30dfed.jpg: 90   # train
    182169121_jpg.rf.eb0ccb71d0ea38adf1e38bf9c02a4a15.jpg: 270  # train
    182169108_jpg.rf.205d9f1ed8f888006b8f97fc29eb8790.jpg: 270  # valid
    182169109_jpg.rf.0531e60eb6e404d9633ed0c23a381fe7.jpg: 90   # valid

# Things vs stuff, used ONLY for evaluation breakdowns (never for training).
# Source: the COCO panoptic "stuff" categories whose names exist in v5 (28 classes).
# v5 names that are not COCO categories (fire-extinguisher, pan, paper, plug, scissor, st-,
# stove-merged, toy, trash-bin, wall, wallet) are assumptions: only `wall` is treated as stuff,
# the rest as things. Every class not listed here counts as a thing.
stuff_classes:
  # COCO panoptic stuff
  - blanket
  - cabinet-merged
  - cardboard
  - ceiling-merged
  - counter
  - curtain
  - door-stuff
  - floor-other-merged
  - floor-wood
  - flower
  - food-other-merged
  - light
  - mirror-stuff
  - paper-merged
  - pillow
  - rug-merged
  - shelf
  - stairs
  - table-merged
  - towel
  - tree-merged
  - wall-brick
  - wall-other-merged
  - wall-stone
  - wall-tile
  - wall-wood
  - window-blind
  - window-other
  # assumption (not a COCO category)
  - wall

# Importer of the self-made phone test set (python -m iiss.data.phone). Directories and files are
# relative to paths.phone_root.
phone_import:
  originals_dir: originals
  export_dir: roboflow-export
  export_splits: [valid, test]  # split forced by Roboflow, merged into one set
  metadata_file: metadata.csv
  # Occluded objects were annotated as several pieces. No photo shows more than one object of
  # these classes, so all annotations of such a class in one image become one annotation with
  # several polygons (user decision 2026-11-24). Every other class is left as annotated.
  merge_fragments:
    - chair
    - door-stuff
    - floor-other-merged

eval:
  max_dets: 100
  score_threshold: 0.0
  # GT annotation file per eval set (relative to the repo root).
  gt_files:
    valid: dataset/panoptic-indoor-segmentation.v5i.coco-segmentation/valid/_annotations.coco.json
    test: dataset/panoptic-indoor-segmentation.v5i.coco-segmentation/test/_annotations.coco.json
    phone: dataset/derived/phone/annotations.coco.json
  train_gt: dataset/panoptic-indoor-segmentation.v5i.coco-segmentation/train/_annotations.coco.json
  results_root: results/eval

# Evaluation sets: valid (in-distribution), test (original, shifted), phone (self-made).
eval_sets: [valid, test, phone]

smoke:
  max_train_images: 16
  max_eval_images: 8
  max_epochs: 2
  max_iters: 50
  input_size: 320
  max_minutes: 5
  output_dir: runs/smoke

logging:
  tensorboard: true
  wandb: false
