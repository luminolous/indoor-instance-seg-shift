# Run yolo_s960_seed42: ablation (priority 5 of 9, see .agent/experiments.md).
# Merged as configs/base.yaml -> configs/models/<model>.yaml -> this file.
# Only the assigned variable lives here. Batch-size overrides (VRAM only) go here too,
# with `train.accumulate` raised to keep the effective batch; log every override.
run_id: yolo_s960_seed42
model: yolo
input_size: 960
seed: 42
role: ablation
priority: 5

# VRAM override (vram_probe 2026-11-23, results/vram_probe/probe.csv): batch 8 peaks at
# 7882 MB (above the 6141 MB card, shared-memory spill, 1.55 s/iter); batch 4 peaks at 5470 MB.
# Ultralytics accumulates to nbs=64 by itself, so the effective batch stays 64.
train:
  batch: 4
