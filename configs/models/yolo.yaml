# YOLO11-seg (one-stage CNN, prototype masks).
model: yolo
family: one-stage-cnn
library: ultralytics
weights: yolo11s-seg.pt  # COCO-pretrained; downloaded by Ultralytics into runs/pretrained/

# Passed to ultralytics `YOLO.train`. Everything not listed uses the Ultralytics default,
# including augmentation (not tuned in this project). imgsz, seed, amp, deterministic,
# project and name are filled in from the run config by iiss.models.yolo.
train:
  epochs: 100       # same budget for every S; tentative until vram_probe (cap may cut 960 short)
  batch: 8          # may differ per S only if VRAM forces it (log it)
  nbs: 64           # nominal batch: Ultralytics accumulates gradients up to 64 for any batch
  workers: 4
  patience: 100     # Ultralytics default early stopping
  optimizer: auto
  plots: true

# Passed to ultralytics `YOLO.predict` when exporting COCO results JSON.
predict:
  conf: 0.001        # low threshold, as Ultralytics uses for mAP validation
  iou: 0.7           # NMS IoU (Ultralytics default)
  retina_masks: true # masks at the original image resolution (needed for RLE export)
